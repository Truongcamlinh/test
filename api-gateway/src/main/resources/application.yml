server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/api/v1/books/**

        - id: borrow-service
          uri: lb://borrow-service
          predicates:
            - Path=/api/v1/borrows/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
